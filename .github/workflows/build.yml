name: build

# Compiles the mod and runs the unit tests. Does not publish a jar anywhere.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build
        run: ./gradlew build --stacktrace --no-daemon
