plugins {
    id "fabric-loom" version "1.8.13"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    // Empty stand-ins for classes that live inside Create's nested jars.
    // The compiler needs the names. They are not packed into our jar.
    stubs {
        java {
            srcDir "src/stubs/java"
        }
    }
}

repositories {
    // Every third-party mod below is the exact pack build from the Stage 1 appendix.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "DevOS"
        url = "https://mvn.devos.one/releases"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile and dev-runtime only. Loom does not nest these into our jar.
    // Horseshoes 1.0.3 (Modrinth tyg1IZwj / 2C5267EF).
    modImplementation "maven.modrinth:horseshoes:1.0.3"
    // Mutant Monsters v8.0.8-1.20.1-Fabric (derP0ten / W1xZlM32).
    modImplementation "maven.modrinth:mutant-monsters:v8.0.8-1.20.1-Fabric"
    // Paragliders 20.1.4 (esqWA0aQ / 6qmc3Nyl). Mod id is "paraglider".
    modImplementation "maven.modrinth:paragliders:20.1.4"
    // Supplementaries 1.20-3.1.44-fabric (fFEIiSDQ / hsHs7Gle).
    modImplementation "maven.modrinth:supplementaries:1.20-3.1.44-fabric"
    // Inventorio 1.10.4+1.20.1 Fabric (inventorio / 11nerhMX). Named by version id because
    // the Forge build has the same version number. Compile only and optional: SackEncumbranceMixin
    // reads its Deep Pockets, utility belt and tool belt stacks, and is applied only when
    // Inventorio is loaded. Not packed into our jar.
    modCompileOnly("maven.modrinth:inventorio:11nerhMX") { transitive = false }
    // Connected Paths Mod 1.0.2 Fabric (connected-paths-mod / g2nakYrI), client only: PPM67 config-load,
    // properties and regeneration hooks. Compile-time only; the pack ships the mod.
    modCompileOnly("maven.modrinth:connected-paths-mod:g2nakYrI") { transitive = false }
    // Create Fabric 6.0.8.1+build.1744-mc1.20.1 (Xbc0uyRg / HAqwA6X1). Compile only.
    // Loom remaps inherited Minecraft calls (BasinBlockEntity.getWorld -> method_10997)
    // only when the real class and its superinterfaces are on the remap classpath.
    // A stub left that call named getWorld, and every basin crashed with NoSuchMethodError.
    // Ponder and Porting Lib are the versions nested in that Create jar. Not packed into ours.
    modCompileOnly("maven.modrinth:create-fabric:6.0.8.1+build.1744-mc1.20.1") { transitive = false }
    modCompileOnly("net.createmod.ponder:Ponder-Fabric-1.20.1:1.0.91") { transitive = false }
    modCompileOnly("dev.engine-room.flywheel:flywheel-fabric-1.20.1:1.0.5-264") { transitive = false }
    def portingLib = "2.3.13+1.20.1"
    ["base", "core", "transfer", "fluids", "extensions", "common", "entity", "accessors", "utility", "tags", "config", "attributes", "lazy_registration", "tool_actions", "gui_utils", "mixin_extensions"].each { module ->
        modCompileOnly("io.github.fabricators_of_create.Porting-Lib:${module}:${portingLib}") { transitive = false }
    }
    //
    // Numismatics 1.1.0+fabric-mc1.20.1 (Jdbbtt0i / X08Z2kZi) is the coin target.
    // Coin implements a Create interface, so it has the same nested-jar problem.
    // CoinValueMixin is @Pseudo and is checked when the game starts.
    //
    // Create: Enchantment Industry 2.5.2-g (JWGBpFUP / Or9rfT7c) is the printer and
    // Blaze Forger target. It needs Create the same way, so those mixins are @Pseudo too.
    //
    // Pehkui 3.8.3+1.14.4-1.21 (t5W7Jfwy / 6fzxx6SC). Size only. The baby timer sets
    // the base scale itself and does not turn on Pehkui's health, motion or attack scale.
    modImplementation "maven.modrinth:pehkui:3.8.3+1.14.4-1.21"

    // 0.4.2 compat targets, compile only and optional (each mixin is applied only when its mod is loaded;
    // see CouncilCraftMixinPlugin.OPTIONAL_MIXINS). None of these is packed into our jar.
    // Nameplate 1.1.4+1.20.1 (9J82qMn9 / mFgPkM5x) and GeckoLib 4.8.4 (8BmcQJ2H / SD2lOScS): PM14e.
    modCompileOnly("maven.modrinth:nameplate:mFgPkM5x") { transitive = false }
    modCompileOnly("maven.modrinth:geckolib:SD2lOScS") { transitive = false }
    // Distant Horizons 3.3.3-1.20.1 (uCdwusMi / 6UnEfsRQ): PM21 deferred-render cancel (DH API only).
    // Immersive Portals' PortalRendering lives in a nested jar, so it is a stub in src/stubs.
    modCompileOnly("maven.modrinth:distanthorizons:6UnEfsRQ") { transitive = false }

    // 0.4.5 compat targets, compile only and optional (see CouncilCraftMixinPlugin.OPTIONAL_MIXINS).
    // Carry On 2.1.2.7 Fabric (joEfVgkn / Mkla4B3q): PPM35 CarryOnWeightMixin.
    // Iris DHCompat and Immersive Portals' IrisPortalRenderer are @Pseudo string targets (PPM5 / PPM7);
    // IP's MyRenderHelper and PortalRendering live in a nested jar, so they are stubs in src/stubs.
    modCompileOnly("maven.modrinth:carry-on:Mkla4B3q") { transitive = false }

    // 0.4.6 compat targets, compile only (not packed into our jar).
    // Iris 1.7.6+mc1.20.1 (YL57xq9U / s5eFLITc): PPM61 graphics presets write the shader choice through IrisConfig.
    // That jar was built with a newer Loom than ours, so Iris and IrisConfig are stubs in src/stubs (their methods
    // used here take no Minecraft types). Distant Horizons (above) also provides the DH core Config used for the
    // preset. Easy Anvils' menu is a @Pseudo string target (PPM51 EasyAnvilPrintedCopyMixin).

    // 0.4.9 compat targets, compile only and optional (see CouncilCraftMixinPlugin.OPTIONAL_MIXINS).
    // Small Ships 2.0.1 Fabric (S6IU4Y5c): PPM75 DockyardWoodPreselectMixin.
    // Wakes 0.4.0+1.20.1 (hUOdfRBT): PPM80 Wakes*Mixin, WakeHandlerAccess and WakesWorldSync.
    modCompileOnly("maven.modrinth:small-ships:S6IU4Y5c") { transitive = false }
    modCompileOnly("maven.modrinth:wakes:hUOdfRBT") { transitive = false }

    // 0.4.10 compat target, compile only and optional (see CouncilCraftMixinPlugin.OPTIONAL_MIXINS).
    // Controlify 2.0.4+1.20.1 Fabric (DOUdJVEm / sDAshEPv): PPM88 reads the input mode and the
    // binding glyphs through its API (ControlifyApi, BindingFontHelper). The PPM86 / PPM87 mixins are
    // @Pseudo string targets.
    modCompileOnly("maven.modrinth:controlify:sDAshEPv") { transitive = false }
    // PPM88 reads Inventorio's utility-belt slot range, a Kotlin IntRange. Kotlin itself comes from
    // Fabric Language Kotlin, which Inventorio requires at runtime.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"

    // 0.4.12 compat targets, stubs only (not packed into our jar; each is used only when its mod is loaded).
    // Surveyor 1.2.4+1.20 (6Wx9cnqi): PPM100 SurveyorExploration. Built with a newer Loom than ours, so a stub.
    // Immersive Portals' NewChunkTrackingGraph / DimensionalChunkPos / SignalBiArged live in nested jars: stubs.
    // Punchy 2.8g (oHLgDk4y): PPM101 PunchyConfig, a stub (only snapshot/applyAndSave/enableMod are used).

    // Libraries those mods require, so `./gradlew runServer` can boot. Not shipped in our jar.
    // Puzzles Lib v8.1.36 (QAGBst4M / QSW0oJPl), Forge Config API Port 8.0.3 (ohNO6lps / HvR3IdRE),
    // Moonlight 1.20-2.16.37 (twkfQtEc / UAIkz6Kg); also on the compile classpath for PPM105, which
    // sends Supplementaries' quiver message through Moonlight's ChannelHandler.
    modRuntimeOnly "maven.modrinth:puzzles-lib:v8.1.36-1.20.1-Fabric"
    modRuntimeOnly "maven.modrinth:forge-config-api-port:v8.0.3-1.20.1-Fabric"
    modImplementation "maven.modrinth:moonlight:1.20-2.16.37-fabric"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

jar {
    // PPM54: the mod is MIT; ship the license text inside the jar.
    from("LICENSE")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

sourceSets {
    jarcheck {
        java.srcDir "src/jarcheck/java"
    }
    stubs {
        java.srcDir "src/stubs/java"
    }
}

dependencies {
    jarcheckImplementation "org.ow2.asm:asm:9.7.1"
    jarcheckImplementation "org.ow2.asm:asm-tree:9.7.1"
    testImplementation sourceSets.jarcheck.output
    testImplementation "org.ow2.asm:asm:9.7.1"
    testImplementation "org.ow2.asm:asm-tree:9.7.1"
}

tasks.named("compileStubsJava") {
    // Stubs name Create and CEI classes. A few of those signatures mention
    // Minecraft types, so this compile can see Minecraft. The stub classes
    // themselves are still not packed into the mod jar. Assign the classpath
    // instead of appending, so this task does not depend on main's output.
    classpath = sourceSets.main.compileClasspath
}

tasks.named("compileJava") {
    dependsOn tasks.named("compileStubsJava")
    classpath += sourceSets.stubs.output
}

tasks.withType(JavaCompile).configureEach {
    // The pack runs Java 17. JDK 21 may run Gradle, but the class files must be 17.
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

test {
    useJUnitPlatform()
}

tasks.register("checkUnmappedYarn", JavaExec) {
    group = "verification"
    description = "Fail if the remapped jar still names a Minecraft member with a yarn name."
    dependsOn tasks.named("remapJar"), tasks.named("compileJarcheckJava")
    classpath = sourceSets.jarcheck.runtimeClasspath
    mainClass = "dev.councilcraft.build.UnmappedYarnCheck"
    def remapped = tasks.named("remapJar", net.fabricmc.loom.task.RemapJarTask).flatMap { it.archiveFile }
    inputs.file(remapped)
    inputs.files(sourceSets.main.compileClasspath, sourceSets.stubs.output)
    doFirst {
        def mappings = configurations.getByName("mappings").files.find {
            it.name.contains("yarn") && it.name.endsWith(".jar") && !it.name.contains("constants")
        }
        if (mappings == null) {
            throw new GradleException("yarn mappings jar not on the mappings configuration")
        }
        def classpath = sourceSets.main.compileClasspath + sourceSets.stubs.output
        args mappings.absolutePath, remapped.get().asFile.absolutePath, classpath.asPath
    }
}

tasks.named("check") {
    dependsOn tasks.named("checkUnmappedYarn")
}
