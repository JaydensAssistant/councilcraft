plugins {
    id "fabric-loom" version "1.8.13"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    // Empty stand-ins for classes that live inside Create's nested jars.
    // The compiler needs the names. They are not packed into our jar.
    stubs {
        java {
            srcDir "src/stubs/java"
        }
    }
}

repositories {
    // Every third-party mod below is the exact pack build from the Stage 1 appendix.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "DevOS"
        url = "https://mvn.devos.one/releases"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile and dev-runtime only. Loom does not nest these into our jar.
    // Horseshoes 1.0.3 (Modrinth tyg1IZwj / 2C5267EF).
    modImplementation "maven.modrinth:horseshoes:1.0.3"
    // Mutant Monsters v8.0.8-1.20.1-Fabric (derP0ten / W1xZlM32).
    modImplementation "maven.modrinth:mutant-monsters:v8.0.8-1.20.1-Fabric"
    // Paragliders 20.1.4 (esqWA0aQ / 6qmc3Nyl). Mod id is "paraglider".
    modImplementation "maven.modrinth:paragliders:20.1.4"
    // Supplementaries 1.20-3.1.44-fabric (fFEIiSDQ / hsHs7Gle).
    modImplementation "maven.modrinth:supplementaries:1.20-3.1.44-fabric"
    // Create Fabric 6.0.8.1+build.1744-mc1.20.1 (Xbc0uyRg / HAqwA6X1). Compile only.
    // Loom remaps inherited Minecraft calls (BasinBlockEntity.getWorld -> method_10997)
    // only when the real class and its superinterfaces are on the remap classpath.
    // A stub left that call named getWorld, and every basin crashed with NoSuchMethodError.
    // Ponder and Porting Lib are the versions nested in that Create jar. Not packed into ours.
    modCompileOnly("maven.modrinth:create-fabric:6.0.8.1+build.1744-mc1.20.1") { transitive = false }
    modCompileOnly("net.createmod.ponder:Ponder-Fabric-1.20.1:1.0.91") { transitive = false }
    modCompileOnly("dev.engine-room.flywheel:flywheel-fabric-1.20.1:1.0.5-264") { transitive = false }
    def portingLib = "2.3.13+1.20.1"
    ["base", "core", "transfer", "fluids", "extensions", "common", "entity", "accessors", "utility", "tags", "config", "attributes", "lazy_registration", "tool_actions", "gui_utils", "mixin_extensions"].each { module ->
        modCompileOnly("io.github.fabricators_of_create.Porting-Lib:${module}:${portingLib}") { transitive = false }
    }
    //
    // Numismatics 1.1.0+fabric-mc1.20.1 (Jdbbtt0i / X08Z2kZi) is the coin target.
    // Coin implements a Create interface, so it has the same nested-jar problem.
    // CoinValueMixin is @Pseudo and is checked when the game starts.
    //
    // Create: Enchantment Industry 2.5.2-g (JWGBpFUP / Or9rfT7c) is the printer and
    // Blaze Forger target. It needs Create the same way, so those mixins are @Pseudo too.
    //
    // Pehkui 3.8.3+1.14.4-1.21 (t5W7Jfwy / 6fzxx6SC). Size only. The baby timer sets
    // the base scale itself and does not turn on Pehkui's health, motion or attack scale.
    modImplementation "maven.modrinth:pehkui:3.8.3+1.14.4-1.21"

    // Libraries those mods require, so `./gradlew runServer` can boot. Not shipped in our jar.
    // Puzzles Lib v8.1.36 (QAGBst4M / QSW0oJPl), Forge Config API Port 8.0.3 (ohNO6lps / HvR3IdRE),
    // Moonlight 1.20-2.16.37 (twkfQtEc / UAIkz6Kg).
    modRuntimeOnly "maven.modrinth:puzzles-lib:v8.1.36-1.20.1-Fabric"
    modRuntimeOnly "maven.modrinth:forge-config-api-port:v8.0.3-1.20.1-Fabric"
    modRuntimeOnly "maven.modrinth:moonlight:1.20-2.16.37-fabric"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

sourceSets {
    jarcheck {
        java.srcDir "src/jarcheck/java"
    }
    stubs {
        java.srcDir "src/stubs/java"
    }
}

dependencies {
    jarcheckImplementation "org.ow2.asm:asm:9.7.1"
    jarcheckImplementation "org.ow2.asm:asm-tree:9.7.1"
    testImplementation sourceSets.jarcheck.output
    testImplementation "org.ow2.asm:asm:9.7.1"
    testImplementation "org.ow2.asm:asm-tree:9.7.1"
}

tasks.named("compileStubsJava") {
    // Stubs name Create and CEI classes. A few of those signatures mention
    // Minecraft types, so this compile can see Minecraft. The stub classes
    // themselves are still not packed into the mod jar. Assign the classpath
    // instead of appending, so this task does not depend on main's output.
    classpath = sourceSets.main.compileClasspath
}

tasks.named("compileJava") {
    dependsOn tasks.named("compileStubsJava")
    classpath += sourceSets.stubs.output
}

tasks.withType(JavaCompile).configureEach {
    // The pack runs Java 17. JDK 21 may run Gradle, but the class files must be 17.
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

test {
    useJUnitPlatform()
}

tasks.register("checkUnmappedYarn", JavaExec) {
    group = "verification"
    description = "Fail if the remapped jar still names a Minecraft member with a yarn name."
    dependsOn tasks.named("remapJar"), tasks.named("compileJarcheckJava")
    classpath = sourceSets.jarcheck.runtimeClasspath
    mainClass = "dev.councilcraft.build.UnmappedYarnCheck"
    def remapped = tasks.named("remapJar", net.fabricmc.loom.task.RemapJarTask).flatMap { it.archiveFile }
    inputs.file(remapped)
    inputs.files(sourceSets.main.compileClasspath)
    doFirst {
        def mappings = configurations.getByName("mappings").files.find {
            it.name.contains("yarn") && it.name.endsWith(".jar") && !it.name.contains("constants")
        }
        if (mappings == null) {
            throw new GradleException("yarn mappings jar not on the mappings configuration")
        }
        args mappings.absolutePath, remapped.get().asFile.absolutePath, sourceSets.main.compileClasspath.asPath
    }
}

tasks.named("check") {
    dependsOn tasks.named("checkUnmappedYarn")
}
