# This holds the schematic version for internal purposes. DO NOT TOUCH!
schematicVersion = 3

# This category holds configs that define uuid behaviour.
[Ship]
	#Set the speed indication: 0 = km/h, 1 = m/s, 2 = knots, 3 = mph
	shipModSpeedUnit = 0

	#This category holds configs that define general uuid behaviour.
	[Ship.General]
		#General camera settings for ships.
		[Ship.General.Camera]
			#Center the third person camera on the ship instead of the player, allowing a full 360 degree orbit.
			shipGeneralCameraShipCenterEnable = true
			#Automatically enable third person camera when entering a uuid.
			shipGeneralCameraAutoThirdPerson = true

			#Zoom camera settings for third person view in ships.
			[Ship.General.Camera.Zoom]
				#Set minimum distance of zoom (value must be bigger than or equal to 1.0).
				#Range: 1.0 ~ 50.0
				shipGeneralCameraZoomMin = 5.0
				#Generally enable the zooming feature.
				shipGeneralCameraZoomEnable = true
				#Set maximum distance of zoom (value must be smaller than or equal to 50.0).
				#Range: 1.0 ~ 50.0
				shipGeneralCameraZoomMax = 20.0
#Visual wind settings.
[Wind]
	#Base amount of wind line particles spawned per tick (scaled with wind strength).
	windParticlesAmount = 3
	#Show the white wind lines on the water surface.
	windParticlesEnable = true
	#Let the ship banner follow the wind direction.
	windBannerEnable = true
# This category holds configs that define general mod settings.
[General]
	#Check for a new version of the mod and show a chat message when joining a world while an update is available.
	updateCheckerEnable = false
	#Enable smallships creative tab in the creative inventory (only takes effect after restart).
	smallshipsItemGroupEnable = true
